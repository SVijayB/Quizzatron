name: CI - Test and Coverage

on:
    push:
        branches: [main, "revamp**"]
    pull_request:
        branches: [main]

jobs:
    backend:
        name: Backend (py${{ matrix.python-version }}, ${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                python-version: ["3.11", "3.12", "3.13"]

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip

            - name: Install
              # Installs from pyproject.toml, the single source of dependency
              # truth. requirements.txt is generated from it for pip-only hosts.
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e ".[dev]"

            - name: Test
              # No API keys and no MongoDB are provided on purpose: the suite
              # must pass without credentials, using the offline model.
              env:
                  FLASK_ENV: TEST
                  SECRET_KEY: ci-secret
                  ALLOW_OFFLINE_MODEL: "1"
              run: pytest --cov=api --cov-report=xml --cov-report=term-missing

            - name: Upload coverage
              if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
              uses: codecov/codecov-action@v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: coverage.xml
                  flags: backend
                  fail_ci_if_error: false

    frontend:
        name: Frontend
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - run: npm ci
            - name: Typecheck
              run: npm run typecheck
            - name: Lint
              run: npm run lint
            - name: Build
              run: npm run build
