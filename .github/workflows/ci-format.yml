name: CI - Lint and Format

on:
    push:
        branches: [main, "revamp**"]
    pull_request:
        branches: [main]

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip

            - name: Install
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e ".[dev]"

            # .pylintrc is committed so this gate is reproducible locally.
            - name: Pylint
              run: pylint --fail-under=10 api/

            - name: Black
              run: black --check api tests wsgi.py

            - name: isort
              run: isort --check-only api tests wsgi.py
